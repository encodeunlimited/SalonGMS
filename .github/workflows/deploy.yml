name: Deploy PHAR via FTP

on:
  push:
    branches:
      - main # Change this to your deployment branch if different
  workflow_dispatch:
    inputs:
      clear_cache:
        description: 'Clear Application & Template Cache on Deploy'
        required: true
        type: boolean
        default: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2' # Update this to your PHP version
          
      - name: Install Dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Clear Build Cache
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.clear_cache }}
        run: php bin/clear-cache.php

      - name: Run Database Migrations & Performance Index Optimization
        run: php bin/migrate_action.php

      - name: Build PHAR
        run: php -d phar.readonly=0 bin/build.php

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        with:
          server: ftp.gs.encodeunlimited.com
          username: u600962660.gsadmin
          password: ${{ secrets.PHAR_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          timeout: 120000
          local-dir: ./build/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            data/**
            uploads/**

      - name: Invalidate Remote Cache
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.clear_cache }}
        continue-on-error: true
        run: |
          echo "Triggering remote cache invalidation..."
          curl -s -k -X POST "https://gs.encodeunlimited.com/web/system/clear-cache?token=salongms_deploy_cache_clear" || true
          echo "Remote cache clear request complete."
